# Every push to main: run the tests, then deploy to Cloudflare if they pass.
# One-time setup in GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown on the Cloudflare dashboard home page
# Page edits made in the studio do not need this: they go live on Publish.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: deploy-production

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
